name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run ingestion
        run: python src/ingestion/run.py

      - name: Run tests
        run: pytest tests/ -v --tb=short

      - name: Run evaluation
        run: |
          python -c "
          import sys; sys.path.insert(0, 'src')
          from eval.metrics import evaluate_retrieval
          from eval.test_queries import TEST_QUERIES
          from retrieval.searcher import Searcher
          r = evaluate_retrieval(TEST_QUERIES, Searcher())
          print(f'Hit Rate@5: {r[\"hit_rate\"]}, MRR: {r[\"mrr\"]}')
          assert r['hit_rate'] >= 0.8, f'Hit rate too low: {r[\"hit_rate\"]}'
          assert r['mrr'] >= 0.8, f'MRR too low: {r[\"mrr\"]}'
          "
