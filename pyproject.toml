[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "docq"
version = "0.1.0"
description = "Production-grade Retrieval-Augmented Generation QA engine with streaming responses, multi-model support, and built-in evaluation"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
keywords = ["rag", "llm", "retrieval-augmented-generation", "qa", "chatbot"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py312"
